name: Offline Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run structural/source-contract suite
        run: |
          python -m pytest -q \
            tests/test_product_shell_structure.py \
            tests/test_document_conformance_structure.py \
            tests/test_live_document_navigation_structure.py

  lua-observation:
    name: Lua offline behavioural contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build validation LuaJIT
        run: |
          for tool in git make cc ar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Validation runtime prerequisite unavailable on hosted runner: $tool"
              exit 1
            fi
          done
          git clone --quiet https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          git -C "$RUNNER_TEMP/luajit" checkout --quiet c525bcb9024510cad9e170e12b6209aedb330f83
          make -C "$RUNNER_TEMP/luajit" -j2 XCFLAGS=-DLUAJIT_ENABLE_LUA52COMPAT
          echo "LUAJIT_BIN=$RUNNER_TEMP/luajit/src/luajit" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/luajit/src/luajit" -v

      # Historical 0.4 source is preserved by the immutable archive/0.4.11.0 Git branch.
      - name: Check active shell Lua syntax
        run: |
          for file in \
            scripts/main.lua \
            scripts/config.lua \
            scripts/assessment/SpatialPairInference.lua \
            scripts/coordination/HoldRelocateCoordinator.lua \
            scripts/control/mechanisms/NativeReverseMechanism.lua \
            scripts/control/mechanisms/NativeTranslationHoldMechanism.lua \
            scripts/observation/NativeBlockageObservation.lua \
            scripts/configuration/Configuration.lua \
            scripts/diagnostics/DiagnosticPublicationPolicySource.lua \
            scripts/publication/LogPublication.lua \
            scripts/diagnostics/VersionHud.lua \
            scripts/gui/ConfigurationSettingsExtension.lua \
            scripts/gui/DisabledStartupReminder.lua
          do
            CHECK_FILE="$file" "$LUAJIT_BIN" -e 'assert(loadfile(os.getenv("CHECK_FILE")))'
          done

      - name: Run shell bootstrap and retained supporting contracts
        run: |
          "$LUAJIT_BIN" tests/shell/main_smoke.lua
          "$LUAJIT_BIN" tests/shell/spatial_pair_inference.lua
          "$LUAJIT_BIN" tests/shell/hold_relocate.lua
          "$LUAJIT_BIN" tests/shell/native_reverse_mechanism.lua
          "$LUAJIT_BIN" tests/shell/native_translation_hold_mechanism.lua
          "$LUAJIT_BIN" tests/shell/native_blockage_observation.lua
          "$LUAJIT_BIN" tests/shell/configuration_persistence.lua
          "$LUAJIT_BIN" tests/replacement_core/diagnostic_publication_policy_source.lua
          "$LUAJIT_BIN" tests/replacement_core/log_publication.lua

  source-reference:
    name: Generated source reference
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare derived source copies
        run: python tools/source_reference.py prepare
        env:
          OMW_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Render source reference with LDoc 1.5.0
        uses: lunarmodules/ldoc@v1.5.0
        with:
          args: -c tools/ldoc/config.ld .generated/source-reference/src

      - name: Verify rendered source reference
        run: python tools/source_reference.py verify

      - name: Publish generated source reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outtamyway-source-reference
          path: |
            .generated/source-reference/html
            .generated/source-reference/manifest.json
            .generated/source-reference/README.txt
          if-no-files-found: warn

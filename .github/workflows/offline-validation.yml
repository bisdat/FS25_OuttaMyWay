name: Offline Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run structural/source-contract suite
        run: python -m pytest -q tests/test_replacement_core_structure.py tests/test_obstruction_relocation_structure.py tests/test_constraint_verdict_ownership_structure.py tests/test_candidate_support_projection_structure.py tests/test_prospective_decision_ownership_structure.py tests/test_regulation_control_structure.py tests/test_physical_control_mechanisms_structure.py tests/test_live_interaction_observation_structure.py tests/test_non_job_actuation_mechanism_structure.py tests/test_runtime_composition_structure.py tests/test_relocation_serialization_structure.py tests/test_production_vocabulary_ownership_structure.py tests/test_forward_intersection_evidence_continuity_structure.py tests/test_issue67_lua_harness_reconciliation_structure.py tests/test_repository_knowledge_governance_structure.py tests/test_runtime_cadence_ownership_structure.py tests/test_assembly_discovery_bound_ownership_structure.py tests/test_representation_cache_bound_ownership_structure.py tests/test_entity_local_shape_evidence_ownership_structure.py tests/test_field_world_value_ownership_structure.py tests/test_hud_glyph_compatibility_structure.py

  lua-observation:
    name: Lua offline behavioural contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build validation LuaJIT
        run: |
          for tool in git make cc ar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Validation runtime prerequisite unavailable on hosted runner: $tool"
              exit 1
            fi
          done
          git clone --quiet https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          git -C "$RUNNER_TEMP/luajit" checkout --quiet c525bcb9024510cad9e170e12b6209aedb330f83
          make -C "$RUNNER_TEMP/luajit" -j2 XCFLAGS=-DLUAJIT_ENABLE_LUA52COMPAT
          echo "LUAJIT_BIN=$RUNNER_TEMP/luajit/src/luajit" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/luajit/src/luajit" -v

      - name: Check changed runtime Lua syntax
        run: |
          for file in \
            scripts/authority/AuthorityRegistry.lua \
            scripts/authority/EffectiveActuationComposition.lua \
            scripts/authority/RegulationBoundedAuthority.lua \
            scripts/assessment/CurrentResponsibilityAssessment.lua \
            scripts/assessment/SituationAssessment.lua \
            scripts/candidates/ObstructionRelocationCandidateSupport.lua \
            scripts/candidates/ProspectiveDecisionPortfolioSupport.lua \
            scripts/candidates/LiveTrafficCandidateSupport.lua \
            scripts/candidates/LocalPassagePlanner.lua \
            scripts/candidates/PassiveLiveCandidateSupport.lua \
            scripts/commitment/CommitmentAdmission.lua \
            scripts/commitment/CommitmentRegistry.lua \
            scripts/commitment/DecisionCommitmentBoundary.lua \
            scripts/commitment/LiveTrafficCommitmentLifecycle.lua \
            scripts/commitment/ObstructionRelocationCommitmentLifecycle.lua \
            scripts/commitment/TerminalSettlementEvaluator.lua \
            scripts/config.lua \
            scripts/contracts/CandidateAction.lua \
            scripts/candidates/CandidateSpace.lua \
            scripts/constraints/ConstraintEvidence.lua \
            scripts/constraints/ConstraintEngine.lua \
            scripts/constraints/evaluators/ResponsibilityCompatibility.lua \
            scripts/constraints/evaluators/CommitmentPreconditions.lua \
            scripts/constraints/evaluators/EffectiveActuationComposition.lua \
            scripts/contracts/CommitmentRecord.lua \
            scripts/contracts/OperationalPicture.lua \
            scripts/control/mechanisms/FieldWorkHoldMechanism.lua \
            scripts/control/mechanisms/NativeDriveMechanism.lua \
            scripts/control/mechanisms/TransitConfigurationMechanism.lua \
            scripts/control/mechanisms/NonJobActuationMechanism.lua \
            scripts/control/CooperativePassageControl.lua \
            scripts/control/ObstructionRelocationControl.lua \
            scripts/control/LiveControlDispatcher.lua \
            scripts/control/RegulationControl.lua \
            scripts/decision/ProspectivePortfolioDecisionPolicy.lua \
            scripts/decision/DecisionSelector.lua \
            scripts/main.lua \
            scripts/identity/FieldWorldSnapshotRegistry.lua \
            scripts/identity/FieldWorldEquivalenceEvaluator.lua \
            scripts/identity/FieldWorldEquivalenceAuthority.lua \
            scripts/representation/EntityLocalShapeEvidence.lua \
            scripts/representation/AssemblyRepresentationCache.lua \
            scripts/representation/CurrentPhysicalConflictRepresentation.lua \
            scripts/diagnostics/FollowerPacingHud.lua \
            scripts/observation/LiveInteractionObservation.lua \
            scripts/observation/LiveObservationSource.lua \
            scripts/observation/CurrentPhysicalPoseSource.lua \
            scripts/observation/NativeManoeuvreObservationSource.lua \
            scripts/responsibility/ObstructionRelocationResponsibilityTransition.lua \
            scripts/runtime/LiveRuntimeCoordinator.lua \
            scripts/runtime/Runtime.lua
          do
            CHECK_FILE="$file" "$LUAJIT_BIN" -e 'assert(loadfile(os.getenv("CHECK_FILE")))'
          done

      - name: Report LuaJIT semantic profile
        run: |
          "$LUAJIT_BIN" -e '
          local proxy = setmetatable({}, {
            __pairs = function()
              return next, {visible = 1}, nil
            end
          })
          local n = 0
          for _ in pairs(proxy) do n = n + 1 end
          print("pairs_metamethod_count=" .. n)
          print("rawlen_available=" .. tostring(type(rawlen) == "function"))
          '

      - name: Run Lua offline harness
        id: lua
        continue-on-error: true
        run: |
          "$LUAJIT_BIN" tests/replacement_core/run.lua

      - name: Run focused obstruction relocation contract
        id: obstruction_relocation
        continue-on-error: true
        run: |
          "$LUAJIT_BIN" tests/replacement_core/obstruction_relocation.lua

      - name: Record Lua behavioural contract outcomes
        if: always()
        run: |
          {
            echo "## Lua offline behavioural contracts"
            echo
            echo "- Main replacement-core outcome: \`${{ steps.lua.outcome }}\`"
            echo "- Focused obstruction-relocation outcome: \`${{ steps.obstruction_relocation.outcome }}\`"
            echo "- **This job is blocking: any non-success inner outcome fails the enforcement gate.**"
            echo "- \`continue-on-error\` keeps evidence collection complete so both harness outcomes remain visible."
            echo "- No failure-count threshold is encoded as an accepted contract."
            echo "- See the job log for the full harness output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Lua behavioural contracts
        if: always()
        run: |
          MAIN_OUTCOME="${{ steps.lua.outcome }}"
          FOCUSED_OUTCOME="${{ steps.obstruction_relocation.outcome }}"
          if [[ "$MAIN_OUTCOME" != "success" || "$FOCUSED_OUTCOME" != "success" ]]; then
            echo "::error::Lua behavioural contracts failed: main=$MAIN_OUTCOME focused=$FOCUSED_OUTCOME"
            exit 1
          fi
          echo "Lua behavioural contracts PASS: main=$MAIN_OUTCOME focused=$FOCUSED_OUTCOME"

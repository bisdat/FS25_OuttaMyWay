name: Cleanup old workflow runs

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep five most recent workflow runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs older than the five most recent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          readonly keep_count=5
          readonly repository="${GITHUB_REPOSITORY}"
          readonly api_version="2026-03-10"
          readonly two_weeks_ago_epoch="$(date -d '14 days ago' +%s)"

          mapfile -t runs < <(
            gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: ${api_version}" "/repos/${repository}/actions/runs?per_page=100" --jq '.workflow_runs[] | [.created_at, (.id | tostring), .status, .name] | @tsv' |
              sort -r
          )

          total_count=${#runs[@]}

          if (( total_count <= keep_count )); then
            echo "Found ${total_count} workflow runs; nothing to delete."
            {
              echo "## Workflow run cleanup"
              echo
              echo "Found **${total_count}** workflow runs. Nothing was deleted."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          candidate_count=$((total_count - keep_count))

          echo "Found ${total_count} workflow runs."
          echo "Keeping the five most recent and evaluating ${candidate_count} older runs for deletion."

          deleted=0
          skipped=0

          for entry in "${runs[@]:keep_count}"; do
            IFS=$'\t' read -r created_at run_id status workflow_name <<< "${entry}"
            created_epoch="$(date -d "${created_at}" +%s)"

            if [[ "${status}" != "completed" ]] && (( created_epoch > two_weeks_ago_epoch )); then
              echo "Skipping run ${run_id} (${workflow_name}, ${created_at}, status=${status}): GitHub does not allow this recent active run to be deleted."
              ((skipped += 1))
              continue
            fi

            echo "Deleting run ${run_id} (${workflow_name}, ${created_at}, status=${status})"
            gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: ${api_version}" "/repos/${repository}/actions/runs/${run_id}"
            ((deleted += 1))
          done

          {
            echo "## Workflow run cleanup"
            echo
            echo "Kept the **5 most recent** workflow runs and deleted **${deleted}** older runs."
            if (( skipped > 0 )); then
              echo
              echo "Skipped **${skipped}** recent active run(s) that GitHub does not yet permit deletion."
            fi
            echo
            echo "The current cleanup run participates in the same recency ordering."
          } >> "${GITHUB_STEP_SUMMARY}"
